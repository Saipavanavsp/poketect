# Render blueprint for the API (New > Blueprint > pick this repo). Set ANTHROPIC_API_KEY in the dashboard.
services:
  - type: web
    name: poketect-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN        # required for trainer edits; copy it from the Environment tab
        generateValue: true
      - key: CORS_ORIGINS
        value: https://saipavanavsp.github.io,https://poketect.vercel.app
