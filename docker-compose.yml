# Full stack locally:  docker compose up --build   ->  http://localhost:8080 (UI), http://localhost:8000/docs (API)
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api
